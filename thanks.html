<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Tanmay Roy</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        
        .thank-you-icon {
            font-size: 4rem;
            color: var(--color-accent);
            margin-bottom: 30px;
            animation: pulse-thanks 2s infinite;
        }
        
        @keyframes pulse-thanks {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .thank-you-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }
        
        .thank-you-title::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 3px;
            background-color: var(--color-accent);
            bottom: -10px;
            left: 30%;
        }
        
        .thank-you-message {
            font-size: 1.2rem;
            color: var(--color-text-secondary);
            max-width: 600px;
            margin: 0 auto 40px auto;
        }
        
        .return-btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid var(--color-accent);
            background-color: transparent;
            color: var(--color-accent);
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .return-btn:hover {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }
        
        .return-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 60, 0, 0.2),
                transparent
            );
            transition: all 0.6s;
        }
        
        .return-btn:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    
    <div class="thank-you-container">
        <div class="thank-you-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="thank-you-title">Message Sent</h1>
        <p class="thank-you-message">Thank you for reaching out! I've received your message and will get back to you as soon as possible.</p>
        <a href="index.html" class="return-btn">RETURN TO HOMEPAGE</a>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 5000); // Redirect after 5 seconds
        });
    </script>
</body>
</html>
